<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Parking Slot - Royal Service Parking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
    <style>
        .slot-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .slot-card {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
        }
        .slot-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .slot-card.unavailable {
            border-color: #ffcccc;
            background-color: #fff5f5;
            opacity: 0.8;
            cursor: not-allowed;
        }
        .slot-card.unavailable:hover {
            transform: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .slot-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .slot-status {
            font-size: 16px;
            margin-bottom: 15px;
        }
        .status-available {
            color: #28a745;
        }
        .status-unavailable {
            color: #dc3545;
        }
        .slot-icon {
            font-size: 36px;
            margin-bottom: 15px;
        }
        .icon-available {
            color: #28a745;
        }
        .icon-unavailable {
            color: #dc3545;
        }
        .booking-details {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .booking-details p {
            margin-bottom: 5px;
        }
        .unavailable-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #dc3545;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div th:replace="~{user/fragments/navbar :: navbar}"></div>
    
    <div class="container mt-5">
        <h1 class="text-center mb-4">Select Parking Slot</h1>
        
        <div class="booking-details">
            <h4>Booking Details</h4>
            <p><strong>Level:</strong> <span th:text="${level}"></span></p>
            <p><strong>Date:</strong> <span th:text="${formattedDate}"></span></p>
            <p th:if="${formattedTime}"><strong>Time:</strong> <span th:text="${formattedTime}"></span></p>
        </div>
        
        <div class="slot-container">
            <div th:each="slot : ${slots}" 
                 th:with="isAvailable=${!slot.temporaryUnavailable}"
                 th:class="${isAvailable ? 'slot-card' : 'slot-card unavailable'}">
                
                <div th:if="${!isAvailable}" class="unavailable-badge">Unavailable</div>
                
                <div class="slot-name" th:text="${slot.slotName}"></div>
                
                <div th:if="${isAvailable}" class="slot-status status-available">Available</div>
                <div th:if="${!isAvailable}" class="slot-status status-unavailable">Unavailable</div>
                
                <div th:if="${isAvailable}" class="slot-icon icon-available">
                    <i class="fas fa-car"></i>
                </div>
                <div th:if="${!isAvailable}" class="slot-icon icon-unavailable">
                    <i class="fas fa-car"></i>
                </div>
                
                <div th:if="${!isAvailable}" class="alert alert-danger mt-2" role="alert">
                    This slot is currently booked for this date
                </div>
                
                <form th:if="${isAvailable}" th:action="@{/user/book/confirm}" method="post">
                    <input type="hidden" name="level" th:value="${level}">
                    <input type="hidden" name="slotName" th:value="${slot.slotName}">
                    <input type="hidden" name="date" th:value="${date}">
                    <!-- Only include time parameters if they exist -->
                    <input th:if="${time != null && time != ''}" type="hidden" name="startTime" th:value="${time}">
                    <input th:if="${time != null && time != ''}" type="hidden" name="exitTime" th:value="${T(java.time.LocalTime).parse(time).plusHours(1)}">
                    <input type="hidden" name="formattedDate" th:value="${formattedDate}">
                    <input type="hidden" name="formattedTime" th:value="${formattedTime}">
                    
                    <button type="submit" class="btn btn-primary">Select</button>
                </form>
                
                <button th:if="${!isAvailable}" class="btn btn-secondary" disabled>Unavailable</button>
            </div>
        </div>
        
        <div class="text-center mt-4">
            <a th:href="@{/user/book}" class="btn btn-secondary">Back to Booking</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
