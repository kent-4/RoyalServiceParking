<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Email Sent - Royal Service Parking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
    <style>
        body {
            background:  url([[@{/images/homepage1.png}]]) no-repeat center center fixed;
            background-size: cover;
        }
        .form-container {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            color: #ff0000;
        }
        .form-container h4,
        .form-container p,
        .form-container .alert-info {
            color: #ff0000;
        }
        .form-container .text-success {
            color: #ff0000 !important;
        }
        .btn-primary {
            background-color: #8B0000;
            border: none;
        }
        .btn-primary:hover {
            background-color: #B22222;
        }
        .btn-outline-secondary {
            color: #ff0000;
            border-color: #ff0000;
        }
        .btn-outline-secondary:hover {
            background-color: #ff0000;
            color: white;
        }
        .alert-info {
            background-color: rgba(255, 255, 255, 0.6);
            border-color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="form-container text-center">
                    <div class="mb-4">
                        <h3><i class="fas fa-envelope me-2"></i>Email Sent</h3>
                    </div>

                    <i class="fas fa-paper-plane fa-4x mb-3 text-success"></i>
                    <h4>Password Reset Email Sent</h4>
                    <p class="mb-4" th:text="${message}">
                        If your email exists in our system, you will receive a password reset link.
                    </p>

                    <div class="alert alert-info">
                        <i class="fas fa-info-circle me-2"></i>
                        Please check your email inbox and spam folder for the reset link.
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <a href="@{/login?type=user}" class="btn btn-primary">
                            <i class="fas fa-arrow-left me-2"></i>Back to Login
                        </a>
                        <a href="@{/}" class="btn btn-outline-secondary">
                            <i class="fas fa-home me-2"></i>Back to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
