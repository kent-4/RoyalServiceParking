<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Royal Service Parking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- FontAwesome for icons -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
    
            body {
            margin: 0;
            padding: 0;
            background: url([[@{/images/user-login.png}]]) no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Frosted glass effect */
        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 20px;
        }

        /* Red color theme */
        .bg-primary {
            background-color: #dc3545 !important;
        }

        /* Improved button styles */
        .btn-primary {
            background-color: #dc3545;
            border-color: #dc3545;
        }

        .btn-primary:hover {
            background-color: #c82333;
            border-color: #c82333;
        }

        .btn-outline-secondary {
            color: #dc3545;
            border-color: #dc3545;
        }

        .btn-outline-secondary:hover {
            background-color: #dc3545;
            color: white;
        }

        /* White input fields */
        .form-control {
            background-color: #fff;
            border: 1px solid #ccc;
        }

        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
        }

        /* Icon support in labels */
        .form-label i {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Create an Account</h3>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <form th:action="@{/register}" th:object="${user}" method="post">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="fullName" class="form-label"><i class="fas fa-user"></i>Full Name</label>
                                    <input type="text" class="form-control" id="fullName" th:field="*{fullName}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                                </div>
                                <div class="col-md-6">
                                <label for="dateOfBirth" class="form-label"><i class="fas fa-calendar-alt"></i>Date of Birth</label>
                                <input type="date" class="form-control" id="dateOfBirth" th:field="*{dateOfBirth}" required>
                                <div class="form-text">You must be at least 15 years old.</div>
                            </div>
                        </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="phoneNumber" class="form-label"><i class="fas fa-phone-alt"></i>Phone Number</label>
                                    <input type="tel" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label"><i class="fas fa-envelope"></i>Email Address</label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label"><i class="fas fa-genderless"></i>Gender</label>
                                    <div class="d-flex">
                                        <div class="form-check me-3">
                                            <input class="form-check-input" type="radio" name="gender" id="male" value="Male" th:field="*{gender}" required>
                                            <label class="form-check-label" for="male">Male</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="gender" id="female" value="Female" th:field="*{gender}">
                                            <label class="form-check-label" for="female">Female</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="plateNumber" class="form-label"><i class="fas fa-car"></i>Plate Number</label>
                                    <input type="text" class="form-control" id="plateNumber" th:field="*{plateNumber}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('plateNumber')}" th:errors="*{plateNumber}"></div>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="vehicleType" class="form-label"><i class="fas fa-truck"></i>Vehicle Type</label>
                                    <select class="form-control" id="vehicleType" th:field="*{vehicleType}" required>
                                        <option value="">Select Vehicle Type</option>
                                        <option value="SUV">SUV</option>
                                        <option value="Sedan">Sedan</option>
                                        <option value="CUV">CUV</option>
                                        <option value="Van">Van</option>
                                        <option value="Hatchback">Hatchback</option>
                                        <option value="Pick Up Car">Pick Up Car</option>
                                        <option value="Convertible">Convertible</option>
                                        <option value="Wagon">Wagon</option>
                                        <option value="Sportscars">Sportscars</option>
                                        <option value="Coupe">Coupe</option>
                                        <option value="Jeep">Jeep</option>
                                        <option value="Motorcycles">Motorcycles</option>
                                    </select>
                                    <div class="text-danger" th:if="${#fields.hasErrors('vehicleType')}" th:errors="*{vehicleType}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="vehicleModel" class="form-label"><i class="fas fa-car-side"></i>Vehicle Model</label>
                                    <input type="text" class="form-control" id="vehicleModel" th:field="*{vehicleModel}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('vehicleModel')}" th:errors="*{vehicleModel}"></div>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="vehicleColor" class="form-label"><i class="fas fa-palette"></i>Vehicle Color</label>
                                    <input type="text" class="form-control" id="vehicleColor" th:field="*{vehicleColor}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('vehicleColor')}" th:errors="*{vehicleColor}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="address" class="form-label"><i class="fas fa-map-marker-alt"></i>Address</label>
                                    <textarea class="form-control" id="address" rows="2" th:field="*{address}"></textarea>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="password" class="form-label"><i class="fas fa-lock"></i>Password</label>
                                    <input type="password" class="form-control" id="password" th:field="*{password}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmPassword" class="form-label"><i class="fas fa-lock"></i>Confirm Password</label>
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                                </div>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="terms" required>
                                <label class="form-check-label" for="terms">I agree to the Terms and Conditions</label>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Create Account</button>
                                <a th:href="@{/login}" class="btn btn-outline-secondary">Already have an account? Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

<!-- Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script to limit DOB to users at least 15 years old -->
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const dobInput = document.getElementById('dateOfBirth');
        const today = new Date();
        const minAge = 15;
        const maxDate = new Date(today.getFullYear() - minAge, today.getMonth(), today.getDate());
        const formattedDate = maxDate.toISOString().split('T')[0];
        dobInput.max = formattedDate;
    });
</script>
</body>
</html>
