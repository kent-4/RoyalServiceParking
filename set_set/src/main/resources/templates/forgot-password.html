<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Royal Service Parking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
    <style>
        body {
            background: url([[@{/images/homepage1.png}]]) no-repeat center center fixed;
            background-size: cover;
        }
        .form-container {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            color: #ff0000;
        }
        .form-control {
            background-color: white;
            border: 1px solid #ff0000;
            color: #000;
        }
        .form-control:focus {
            box-shadow: 0 0 5px #ff0000;
            border-color: #ff0000;
        }
        .form-label i {
            color: #ff0000;
            margin-right: 5px;
        }
        .btn-primary {
            background-color: #8B0000;
            border: none;
        }
        .btn-primary:hover {
            background-color: #B22222;
        }
        .btn-outline-secondary {
            color: #ff0000;
            border-color: #ff0000;
        }
        .btn-outline-secondary:hover {
            background-color: #ff0000;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="form-container">
                    <div class="text-center mb-4">
                        <h3><i class="fas fa-key me-2"></i>Forgot Password</h3>
                    </div>
                    <div th:if="${message}" class="alert alert-success">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${message}"></span>
                    </div>
                    <div th:if="${error}" class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <span th:text="${error}"></span>
                    </div>
                    
                    <p class="mb-4">Please enter your registered email address. We'll send you a link to reset your password.</p>
                    
                    <form th:action="@{/forgot-password}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope"></i>Email Address
                            </label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-paper-plane me-2"></i>Send Reset Link
                            </button>
                            <a href= "@{/}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Back to Login
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
