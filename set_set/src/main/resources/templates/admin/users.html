<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details - Royal Service Parking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/styles/admin.css}">
    <style>
        .table tbody tr {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .table tbody tr:hover {
            background-color: rgba(0,0,0,0.05);
        }
        .verified-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .verified-badge.verified {
            background-color: #198754;
            color: white;
        }
    </style>
</head>
<body>
    <div th:replace="~{admin/fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <h2><i class="fas fa-users me-2"></i>User Details</h2>

        <form class="row g-3 mb-3" method="get" th:action="@{/admin/users}">
            <div class="col-auto">
                <input type="text" class="form-control" name="search" placeholder="Search by name, email, or plate number" th:value="${param.search}">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-danger mb-3"><i class="fas fa-search me-1"></i>Search</button>
            </div>
        </form>

        <div th:if="${success}" class="alert alert-success">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
        </div>
        
        <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <div class="card mt-3">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Address</th>
                                <th>Plate Number</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}" th:if="${user.verified}">
                                <td th:text="${user.id}"></td>
                                <td th:text="${user.fullName}"></td>
                                <td th:text="${user.email}"></td>
                                <td th:text="${user.phoneNumber}"></td>
                                <td th:text="${user.address != null && !user.address.isEmpty() ? user.address : 'Not provided'}"></td>
                                <td th:text="${user.plateNumber}"></td>
                                <td>
                                    <span class="verified-badge verified">
                                        <i class="fas fa-check-circle me-1"></i>Verified
                                    </span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-sm btn-primary">
                                        <i class="fas fa-eye me-1"></i>View Details
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
