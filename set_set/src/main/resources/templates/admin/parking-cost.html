<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Cost - Royal Service Parking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/styles/admin.css}">
</head>
<body>
    <div th:replace="~{admin/fragments/navbar :: navbar}"></div>
    
    <div class="container mt-4">
        <h2><i class="fas fa-money-bill-wave me-2"></i>Parking Cost Management</h2>
        
        <div th:if="${success}" class="alert alert-success">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
        </div>
        
        <div class="card mt-3">
            <div class="card-body">
                <h5 class="card-title">Current Parking Rate</h5>
                <p class="card-text">The current hourly rate is: <strong>₱<span th:text="${parkingCost.hourlyRate}"></span></strong></p>
                
                <form th:action="@{/admin/parking-cost}" method="post">
                    <div class="mb-3">
                        <label for="hourlyRate" class="form-label">
                            <i class="fas fa-edit me-2"></i>Update Hourly Rate (₱)
                        </label>
                        <input type="number" class="form-control" id="hourlyRate" name="hourlyRate" step="0.01" min="0" th:value="${parkingCost.hourlyRate}" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-2"></i>Update Rate
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
