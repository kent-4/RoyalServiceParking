<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Royal Service Parking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
    <style>
        body {
            background: url([[@{/images/admin-login.png}]]) no-repeat center center fixed;
            background-size: cover;
        }
        .form-container {
            backdrop-filter: blur(10px);
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            color: #ffffff;
        }
        .form-container h3,
        .form-container p,
        .form-container label,
        .form-container small,
        .form-text {
            color: #ffffff !important;
        }
        .form-control {
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #ffffff;
            color: #000000;
        }
        .form-control:focus {
            border-color: #ff0000;
            box-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
            background-color: #ffffff;
        }
        .btn-primary {
            background-color: #ff0000;
            border: none;
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #cc0000;
        }
        .btn-outline-secondary {
            color: #ffffff;
            border-color: #ffffff;
        }
        .btn-outline-secondary:hover {
            background-color: #ffffff;
            color: #ff0000;
        }
        .progress {
            height: 5px;
            background-color: rgba(255, 255, 255, 0.2);
        }
        #password-match.text-success {
            color: #00ff00 !important;
        }
        #password-match.text-danger {
            color: #ff6b6b !important;
        }
        .alert-danger {
            background-color: rgba(220, 53, 69, 0.9);
            color: #ffffff;
            border-color: #dc3545;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="form-container">
                <div class="mb-4 text-center">
                    <h3><i class="fas fa-key me-2"></i>Reset Password</h3>
                </div>

                <div th:if="${error}" class="alert alert-danger">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}"></span>
                </div>

                <p class="mb-4">Please enter your new password below.</p>

                <form th:action="@{/reset-password}" method="post" id="resetForm">
                    <input type="hidden" name="token" th:value="${token}">

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock me-2"></i>New Password
                        </label>
                        <input type="password" class="form-control" id="password" name="password"
                               minlength="6" required onkeyup="checkPasswordStrength()">
                        <div class="progress mt-2">
                            <div id="password-strength" class="password-strength progress-bar" role="progressbar"></div>
                        </div>
                        <small id="passwordHelp" class="form-text">
                            Password must be at least 6 characters long.
                        </small>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            <i class="fas fa-lock me-2"></i>Confirm Password
                        </label>
                        <input type="password" class="form-control" id="confirmPassword"
                               name="confirmPassword" required onkeyup="checkPasswordMatch()">
                        <div id="password-match" class="form-text"></div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" id="resetBtn">
                            <i class="fas fa-save me-2"></i>Reset Password
                        </button>
                        <a th:href="@{/login?type=user}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function checkPasswordStrength() {
        const password = document.getElementById('password').value;
        const strengthBar = document.getElementById('password-strength');

        strengthBar.className = 'password-strength progress-bar';
        if (password.length === 0) {
            strengthBar.style.width = '0%';
            return;
        }

        let strength = 0;
        if (password.length >= 6) strength += 20;
        if (password.length >= 8) strength += 20;
        if (/[A-Z]/.test(password)) strength += 20;
        if (/[0-9]/.test(password)) strength += 20;
        if (/[^A-Za-z0-9]/.test(password)) strength += 20;

        strengthBar.style.width = strength + '%';
        if (strength < 40) {
            strengthBar.classList.add('bg-danger');
        } else if (strength < 80) {
            strengthBar.classList.add('bg-warning');
        } else {
            strengthBar.classList.add('bg-success');
        }
    }

    function checkPasswordMatch() {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const matchMessage = document.getElementById('password-match');
        const resetBtn = document.getElementById('resetBtn');

        if (confirmPassword.length === 0) {
            matchMessage.innerHTML = '';
            return;
        }

        if (password === confirmPassword) {
            matchMessage.innerHTML = '<i class="fas fa-check-circle"></i> Passwords match';
            matchMessage.className = 'form-text text-success';
            resetBtn.disabled = false;
        } else {
            matchMessage.innerHTML = '<i class="fas fa-times-circle"></i> Passwords do not match';
            matchMessage.className = 'form-text text-danger';
            resetBtn.disabled = true;
        }
    }
</script>
</body>
</html>
