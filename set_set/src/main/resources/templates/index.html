<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Management System | Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
    <style>
        /* Global Styles */
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            background: url([[@{/images/homepage1.png}]]) no-repeat center center fixed;
            background-size: cover;
        }

        .navbar {
            background-color: rgba(28, 40, 51, 0.8);
        }

        .nav-link {
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        .nav-link:hover {
            color: #6A0DAD;
        }

        /* Hero Section */
        .masthead {
            position: relative;
            color: white; /* ✨ Gold color for luxury feel */
            padding: 100px 0;
            text-align: center;
            flex-grow: 1;
            font-family: 'Poppins', sans-serif; /* ✨ Catchy font */
            font-weight: 600; /* Bold text for emphasis */
            letter-spacing: 2px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6); /* ✨ Enhanced text shadow for visibility */
        }

        .masthead h1 {
            font-size: 9rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 5px 5px 7px rgba(2, 2, 2, 4); /* ✨ Stronger shadow for more depth */
            -webkit-text-stroke: 1.5px black; /* ✨ Outline for better contrast */
        }

        /* Background overlay for better readability */
        .masthead::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Dark overlay */
            z-index: 1;
        }

        /* Main heading with better visibility */
        .masthead h1 {
            font-weight: bold;
            font-size: 3rem;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 2;
        }

        .features {
            padding: 50px 20px;
            text-align: center;
        }

        .feature-box {
            background: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease-in-out;
        }

        .feature-box:hover {
            transform: scale(1.05);
        }

        .footer {
            background-color: rgba(28, 40, 51, 0.9);
            color: white;
            text-align: center;
            padding: 10px 0;
            width: 100%;
        }

        .admin-link {
            border-radius: 30px;
            border: 2px solid #007bff;
            background: rgba(255,255,255,0.05);
            color: #007bff !important;
            font-weight: 600;
            transition: background 0.3s, color 0.3s, box-shadow 0.3s;
        }
        .admin-link:hover {
            background: #007bff;
            color: #fff !important;
            box-shadow: 0 4px 16px rgba(0,123,255,0.15);
        }
        .cashier-link {
            border-radius: 30px;
            border: 2px solid #FFD700;
            background: rgba(255,255,255,0.05);
            color: #FFD700 !important;
            font-weight: 600;
            transition: background 0.3s, color 0.3s, box-shadow 0.3s;
        }
        .cashier-link:hover {
            background: #FFD700;
            color: #212121 !important;
            box-shadow: 0 4px 16px rgba(255,215,0,0.15);
        }
        .divider-vertical {
            display: inline-block;
            width: 2px;
            height: 32px;
            background: linear-gradient(180deg, #6A0DAD 0%, #FFD700 100%);
            margin: 0 8px;
            border-radius: 2px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
   <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Vehicle Parking Management System</a>
        <div class="ms-auto d-flex align-items-center gap-4">
            <a class="nav-link btn btn-outline-light admin-link px-4 py-2 me-2" th:href="@{/login-admin}">Admin</a>
            <span class="divider-vertical"></span>
            <a class="nav-link btn btn-outline-light cashier-link px-4 py-2 ms-2" th:href="@{/login-cashier}">Cashier</a>
        </div>
    </div>
</nav>

    <header class="masthead d-flex align-items-center justify-content-center">
        <div class="container text-center">
            <h1>Royal Service Parking</h1>
        </div>
    </header>

    <section class="features">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5 mb-4">
                    <a th:href="@{/register}" class="feature-box d-block text-decoration-none">
                        <i class="fas fa-car fa-3x text-primary"></i>
                        <h4 class="mt-3">Advance Book Now!</h4>
                        <p>Create an account, log in, and book your parking spot in advance.</p>                    
                    </a>
                </div>
                <div class="col-md-5 mb-4">
                    <a th:href="@{/login(type='user')}" class="feature-box d-block text-decoration-none">
                        <i class="fas fa-calendar-check fa-3x text-primary"></i>
                        <h4 class="mt-3">Login</h4>
                        <p>Already have an account? Log in to manage your bookings.</p>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>Vehicle Parking Management System © 2025</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
