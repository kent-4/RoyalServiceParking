<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Cost - Royal Service Parking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/cashier.css}">
</head>
<body>
    <div th:replace="cashier/fragments/navbar :: navbar"></div>
    
    <div class="container mt-4 parking-cost">
        <h2 class="mb-4 text-luxury-red">Parking Cost Information</h2>
        
        <div class="card mt-3">
            <div class="card-body">
                <h5 class="card-title">Current Parking Rate</h5>
                <p class="card-text">The current hourly rate is: <strong>₱<span th:text="${parkingCost.hourlyRate}"></span></strong></p>
                
                <div class="alert alert-info">
                    <p><i class="fas fa-info-circle me-2"></i>Note: Only administrators can update the parking rate.</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
