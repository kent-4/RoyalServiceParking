<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- Add Font Awesome and Bootstrap CSS/JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/cashier/dashboard}">
                <i class="fas fa-car-side me-2"></i>Royal Service Parking 
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/cashier/dashboard}">
                            <i class="fas fa-tachometer-alt me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/cashier/parking-cost}">
                            <i class="fas fa-money-bill-wave me-1"></i> Parking Rates
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/cashier/users}">
                            <i class="fas fa-users me-1"></i> User Details
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/cashier/bookings}">
                            <i class="fas fa-calendar-check me-1"></i> Manage Bookings
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/cashier/notifications}">
                            <i class="fas fa-bell me-1"></i> Notifications
                            <span class="badge bg-danger">3</span>
                        </a>
                    </li>
                </ul>
                <form th:action="@{/logout}" method="post" class="d-flex">
                    <button class="btn btn-outline-light" type="submit">
                        <i class="fas fa-sign-out-alt me-1"></i> Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>
</body>
</html>
