<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Log - Royal Service Parking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/cashier.css}">
    <!-- Add Flatpickr for better time picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_red.css">
</head>
<body>
    <div th:replace="cashier/fragments/navbar :: navbar"></div>
    
    <div class="container mt-4">
        <h2 class="mb-4 text-luxury-red"><i class="fas fa-credit-card me-2"></i>Payment Log</h2>
        
        <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
        </div>
        
        <div th:if="${success}" class="alert alert-success">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <a th:if="${booking.status.name() == 'COMPLETED'}" th:href="@{/cashier/bookings/{id}/receipt(id=${booking.id})}" class="btn btn-sm btn-success ms-3">
                <i class="fas fa-print me-2"></i>View/Print Receipt
            </a>
        </div>
        
        <div class="card mt-3">
            <div class="card-body">
                <form th:action="@{/cashier/bookings/{id}/complete(id=${booking.id})}" method="post">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">User</label>
                            <input type="text" class="form-control" th:value="${booking.user.fullName}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Plate Number</label>
                            <input type="text" class="form-control" th:value="${booking.plateNumber}" readonly>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Start Date</label>
                            <input type="text" class="form-control" th:value="${#temporals.format(booking.date, 'MMM dd, yyyy')}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" th:value="${booking.level} + ' - ' + ${booking.slotName}" readonly>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Start Time</label>
                            <input type="text" class="form-control" readonly autocomplete="off" th:value="${#temporals.format(booking.startTime, 'hh:mm a')}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Exit Time (Current Time)</label>
                            <input type="text" class="form-control" readonly autocomplete="off" th:value="${#temporals.format(previewExitTime, 'hh:mm a')}">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Parking Duration</label>
                            <input type="text" class="form-control" readonly th:value="${parkingDays > 0 ? parkingDays + ' days ' : ''} + ${parkingHours} + ' hours'">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Status</label>
                            <input type="text" class="form-control" th:value="${booking.status}" readonly>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Hourly Rate</label>
                            <div class="input-group">
                                <span class="input-group-text">₱</span>
                                <input type="text" class="form-control" id="hourlyRate" th:value="${parkingCost.hourlyRate}" readonly>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Total Hours</label>
                            <input type="text" class="form-control" th:value="${totalHours}" readonly>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Total Cost</label>
                            <div class="input-group">
                                <span class="input-group-text">₱</span>
                                <input type="text" class="form-control" id="parkingCostDisplay" name="parkingCostDisplay" readonly th:value="${#numbers.formatDecimal(previewCost, 1, 2)}">
                                <input type="hidden" id="parkingCost" name="parkingCost" th:value="${previewCost}">
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" th:if="${booking.status.name() == 'ARRIVED'}">
                            <i class="fas fa-credit-card me-2"></i>Paid
                        </button>
                        <a th:href="@{/cashier/bookings}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Back to Bookings
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <!-- Removed JS cost calculation and time picker logic; backend is source of truth -->
</body>
</html>
