# Server Configuration for WAR deployment
server.address=0.0.0.0
server.port=8080
# Remove context path for now to test basic functionality
# server.servlet.context-path=/royal-service-parking

# Application URL (updated without context path for testing)
app.url=http://192.168.254.100:8080
frontend.origin=http://localhost:5173
frontend.public-url=http://localhost:5173

# Database Configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/appdev1?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Completely disable Flyway
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
# spring.flyway.locations=classpath:db/migration
# spring.flyway.validate-on-migrate=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Reduce logging for cleaner startup
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.thymeleaf=INFO
logging.level.org.springframework.mail=INFO
logging.level.com.sun.mail=INFO
logging.level.com.appdev.set=INFO

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=royalserviceparking@gmail.com
spring.mail.password=ownl begt eadk hymr
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=false

# Session configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# Error handling
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
